<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Advogados - Contato</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Cabeçalho -->
    <header
      class="bg-[#1a2b4b] py-[2.5rem] text-white flex justify-center border-b-[1.5rem] border-[#b68954]"
    >
      <div class="w-[80%] flex flex-row justify-between items-center">
        <img src="../assets/logo.png" alt="logo dc advogados" />
        <nav>
          <ul class="flex flex-row gap-[2.5rem]">
            <li>
              <a
                class="text-[1.4rem] font-bold hover:text-[#b68954] hover:border-y-5 hover:border-[#b68954] py-[0.7rem] hover:duration-[0.4s] hover:ease-in"
                href="../index.html"
                >Voltar para Home</a
              >
            </li>
            <li>
              <a
                class="text-[1.4rem] font-bold hover:text-[#b68954] hover:border-y-5 hover:border-[#b68954] py-[0.7rem] hover:duration-[0.4s] hover:ease-in"
                href="#"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Formulário de contato -->

    <section>
      <div>
        <div>
          <h2>Contato</h2>
          <p>
            Entre em contato conosco para mais informações ou agendar uma
            consulta. Estamos aqui para ajudar!
          </p>
          <div>
            <div>
              <img src="../assets/telefone.png" alt="telefone" />
              <p>(11) 9999-9999</p>
            </div>

            <div>
              <img src="../assets/email.png" alt="email" />
              <p>(11) 9999-9999</p>
            </div>

            <div>
              <img src="../assets/pino.png" alt="endereço" />
              <p>(11) 9999-9999</p>
            </div>
          </div>
        </div>

        <div>
          <form>
            <div>
              <label for="nome">Nome:</label>
              <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Digite aqui o seu nome"
              />
            </div>

            <div>
              <label for="email">E-mail:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Digite aqui seu email"
              />
            </div>

            <div>
              <label for="">Mensagem:</label>
              <textarea
                name="mensagem"
                id="mensagem"
                placeholder="Digite aqui sua mensagem"
              ></textarea>
            </div>

            <button type="submit">Enviar</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Rodapé -->
    <footer>
      <p>Desenvolvido por Dev. Rodrigo Medeiros - 2025 &copy;</p>
    </footer>
  </body>
</html>

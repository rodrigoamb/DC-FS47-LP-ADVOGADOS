<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Advogados - Contato</title>
  </head>
  <body>
    <!-- Cabeçalho -->
    <header>
      <div>
        <img src="../assets/logo.png" alt="logo dc advogados" />
        <nav>
          <ul>
            <li>
              <a href="../index.html">Voltar para Home</a>
            </li>
            <li>
              <a href="#">Contato</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Formulário de contato -->

    <section>
      <div>
        <div>
          <h2>Contato</h2>
          <p>
            Entre em contato conosco para mais informações ou agendar uma
            consulta. Estamos aqui para ajudar!
          </p>
          <div>
            <div>
              <img src="../assets/telefone.png" alt="telefone" />
              <p>(11) 9999-9999</p>
            </div>

            <div>
              <img src="../assets/email.png" alt="email" />
              <p>(11) 9999-9999</p>
            </div>

            <div>
              <img src="../assets/pino.png" alt="endereço" />
              <p>(11) 9999-9999</p>
            </div>
          </div>
        </div>

        <div>
          <form>
            <div>
              <label for="nome">Nome:</label>
              <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Digite aqui o seu nome"
              />
            </div>

            <div>
              <label for="email">E-mail:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Digite aqui seu email"
              />
            </div>

            <div>
              <label for="">Mensagem:</label>
              <textarea
                name="mensagem"
                id="mensagem"
                placeholder="Digite aqui sua mensagem"
              ></textarea>
            </div>

            <button type="submit">Enviar</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Rodapé -->
    <footer>
      <p>Desenvolvido por Dev. Rodrigo Medeiros - 2025 &copy;</p>
    </footer>
  </body>
</html>
